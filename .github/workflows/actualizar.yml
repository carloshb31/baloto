name: Actualizar datos de Baloto

on:
  schedule:
    # Baloto sortea lunes, miércoles y sábados entre 11:00pm y 11:15pm COT (UTC-5)
    # Corremos ~40 min después del cierre del sorteo, a las 04:00 UTC del día siguiente
    - cron: '30 10 * * 1,2,3,4,5,6'   # martes, jueves y domingo 00:00 COT (madrugada tras el sorteo)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper (incremental)
        run: python scripts/scraper.py

      - name: Ejecutar análisis estadístico
        run: python scripts/analysis.py

      - name: Evaluar combinaciones anteriores (aprendizaje)
        run: python scripts/learning.py

      - name: Generar nuevas combinaciones sugeridas
        run: python scripts/generator.py --n 3

      - name: Commit y push de datos actualizados
        run: |
          git config user.name "baloto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "Actualización automática de datos [skip ci]"
          git push
